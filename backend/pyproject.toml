[project]
name = "smart-customer-service-backend"
version = "0.1.0"
description = "FastAPI backend for the smart customer service demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.29.0,<1.0.0",
    "fastapi[standard]>=0.115.6,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.23,<5",
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "mcp>=1.24,<2",
    "pydantic-settings>=2.7.1,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "redis>=5.0.0,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_llm: calls the configured real LLM and is skipped unless explicitly enabled",
]
