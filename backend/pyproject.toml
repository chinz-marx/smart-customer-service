[project]
name = "smart-customer-service-backend"
version = "0.1.0"
description = "FastAPI backend for the smart customer service demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
